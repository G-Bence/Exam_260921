<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="src/style.css" />
  <title>exam-260921</title>
</head>

<body>
  <div class="container" id="mainContainer">
    <h1 class="h1 text-center text-white mx-auto mb-3">Weather Info</h1>
    <div class="row mb-5">
      <div class="container col-sm-12 col-md-10 col-lg-10" id="tableContainer">
        <table id="mainTable" class="table table-striped table-hover mx-auto">
          <thead id="thead">
          </thead>
          <tbody id="tbody">
          </tbody>
        </table>
      </div>
      <button type="submit" class="btn btn-warning mx-auto w-25 mt-3" id="exportButton">Export</button>
    </div>

    <div class="row mb-5" id="formRow">
      <div class="container col-sm-12 col-md-8 col-lg-6" id="formContainer">
        <h1 class="h1 text-center text-white mx-auto mb-3">How's the weather today?</h1>
        <form id="mainForm">
          <div class="mb-3">
            <label for="dailyTemp" class="form-label text-white">Temperature</label>
            <input type="number" class="form-control" id="dailyTemp" placeholder="Please enter the temperature" required>
          </div>
           <div class="mb-3">
            <label for="dailyDate" class="form-label text-white">Current Date</label>
            <input type="date" class="form-control" id="dailyDate" readonly>
          </div>
          <button type="submit" class="btn btn-primary mx-auto">Submit</button>
        </form>
      </div>
    </div>
    <div class="row" id="textareaRow">
      <div class="container col-sm-12 col-md-8 col-lg-6" id="textareaContainer">
        <textarea class="form-control" id="exportArea" rows="5"></textarea>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>


</html>
